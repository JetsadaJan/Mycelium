[package]
name = "mycelium-core"
version = "0.0.3"
description = "Mycelium — Knowledge Colony & Epistemic AI Verification Engine"
authors = ["Jetsada Janpaijet"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "mycelium_core"
path = "src/lib.rs"

[[bin]]
name = "mycelium"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
walkdir = "2.5"
notify = "6.1"
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
